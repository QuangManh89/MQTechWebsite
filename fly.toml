app = "mqtech-bmt"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "mqtech_data"
  destination = "/data"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  PGLITE_DATA_DIR = "/data/.pglite-data"
  NODE_OPTIONS = "--max-old-space-size=380"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
