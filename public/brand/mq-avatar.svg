<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="av-title">
  <title id="av-title">MQComputer Avatar (Titanium Cobalt Edition)</title>
  <circle cx="128" cy="128" r="124" fill="#0B1120" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.4" />
  <g transform="translate(18, 18) scale(0.86)">
    <g id="symbol">
    <!-- Q Ring with clearance mask -->
    <defs>
      <mask id="qMask">
        <rect width="256" height="256" fill="#FFFFFF" />
        <rect x="46" y="40" width="38" height="176" fill="#000000" />
        <rect x="172" y="40" width="38" height="176" fill="#000000" />
      </mask>
    </defs>
    
    <path fill="#2563EB" fill-rule="evenodd" mask="url(#qMask)" d="
      M 128 48
      A 80 80 0 1 1 127.9 48
      Z
      M 128 64
      A 64 64 0 1 0 128.1 64
      Z
    " />

    <!-- Q Tail: Emerging at exact 45 degrees -->
    <polygon points="186,170 200,156 232,188 218,202" fill="#2563EB" />

    <!-- Letter M: Razor-sharp architectural geometry -->
    <rect x="58" y="52" width="14" height="152" fill="#38BDF8" />
    <rect x="48" y="52" width="34" height="5" fill="#38BDF8" />
    <rect x="48" y="199" width="34" height="5" fill="#38BDF8" />

    <rect x="184" y="52" width="14" height="152" fill="#38BDF8" />
    <rect x="174" y="52" width="34" height="5" fill="#38BDF8" />
    <rect x="174" y="199" width="34" height="5" fill="#38BDF8" />

    <!-- Central V Diagonal: Mathematically exact 60.00 degree slopes -->
    <polygon points="
      70,54
      78,54
      128,141
      178,54
      186,54
      132,147
      124,147
    " fill="#38BDF8" />
  </g>
  </g>
</svg>