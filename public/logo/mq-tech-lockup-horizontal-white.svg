<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 112" width="450" height="112" role="img" aria-label="MQ Tech Computer Service">
  <defs>
    <linearGradient id="mq-sym-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>
  <g id="symbol" fill="none" stroke-linecap="round" stroke-linejoin="round">
