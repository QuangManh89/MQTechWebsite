      <tspan fill="#FFFFFF">MQ</tspan><tspan dx="8" fill="#38BDF8">TECH</tspan>
    </text>
    <text x="158" y="94" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="4.5" fill="#E2E8F0">COMPUTER SERVICE</text>
  </g>
