# ==============================================================================
# MQTech Self-Managed PostgreSQL 16 Configuration
# Optimized for Fly.io Free-Tier Machine (shared-cpu-1x, 256MB RAM, 1GB Volume)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NETWORK & AUTHENTICATION
# ------------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
password_encryption = scram-sha-256

# ------------------------------------------------------------------------------
# 2. CONNECTIONS & RESOURCE USAGE (Tuned for 256MB RAM)
# ------------------------------------------------------------------------------
max_connections = 10                  # Low connection count to avoid connection thrashing
superuser_reserved_connections = 2

# Memory configuration (Strictly bounded to prevent Linux OOM-killer)
# Total estimated memory: shared_buffers (32MB) + (work_mem 1MB * 10 conns = 10MB)
# + maintenance_work_mem (16MB) + OS/process overhead (~80MB) = ~138MB < 256MB RAM
shared_buffers = 32MB
work_mem = 1MB
maintenance_work_mem = 16MB
effective_cache_size = 64MB
wal_buffers = 1MB

# ------------------------------------------------------------------------------
# 3. WRITE-AHEAD LOG & CHECKPOINTS (Tuned for 1GB Persistent Volume)
# ------------------------------------------------------------------------------
wal_level = replica
min_wal_size = 32MB
max_wal_size = 256MB                  # Keep WAL bounded to prevent disk exhaustion on 1GB volume
checkpoint_completion_target = 0.9
checkpoint_timeout = 5min

# ------------------------------------------------------------------------------
# 4. LOGGING (Structured to stderr/stdout for Fly.io log capture)
# ------------------------------------------------------------------------------
logging_collector = off               # Let Docker/Fly capture stdout/stderr directly
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_messages = warning
log_min_error_statement = error
log_connections = on
log_disconnections = on
log_statement = 'ddl'                 # Audit all schema modifications

# ------------------------------------------------------------------------------
# 5. LOCALE & TIMEZONE
# ------------------------------------------------------------------------------
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
