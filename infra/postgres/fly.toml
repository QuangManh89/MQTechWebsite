# ==============================================================================
# Fly.io PostgreSQL Database Configuration: mqtech-db (P5 Staging)
# 
# ARCHITECTURE & MACHINE ALLOCATION:
# - App Name: mqtech-db
# - Hostname: mqtech-db.internal (Private 6PN wireguard mesh only)
# - Region: sin (Singapore)
# - Machine: shared-cpu-1x, 256MB RAM (Dedicated persistent database machine)
# - Volume: 1GB persistent volume named 'pgdata'
# - Mount: /var/lib/postgresql/data
# - Engine: Self-managed PostgreSQL 16 on Alpine Linux (NOT Fly Managed Postgres)
# - Networking: STRICTLY PRIVATE. No public HTTP service. No public TCP port 5432.
# - Auto-stop: DISABLED (database machine must remain running to maintain connections).
# ==============================================================================

app = "mqtech-db"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[build]
  dockerfile = "Dockerfile"

[env]
  PGDATA = "/var/lib/postgresql/data/pgdata"
  POSTGRES_DB = "mqtech"

[mounts]
  source = "pgdata"
  destination = "/var/lib/postgresql/data"
  initial_size = "1gb"

# STRICTLY NO HTTP SERVICE AND NO PUBLIC TCP SERVICES
# Database is reachable ONLY via private 6PN mesh at mqtech-db.internal:5432

# Fly platform-level TCP check on private internal port 5432
[[checks]]
  name = "pg_tcp"
  type = "tcp"
  port = 5432
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
